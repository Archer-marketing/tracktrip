<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monitoreo en vivo — Uchben</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --green-dark: #5b9a3b;
    --green-light: #b9d97a;
    --ink: #16210f;
    --paper: #fbfbf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
  }
  .header {
    padding: 10px 16px; text-align: center; background: white;
    border-bottom: 1px solid #eceee6;
  }
  .brand { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .brand .leaf { color: var(--green-dark); }
  .logo-img { display: none; max-height: 40px; max-width: 200px; }
  .tagline { font-size: 10px; color: #6b7566; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

  .layout { display: flex; height: calc(100vh - 62px); height: calc(100dvh - 62px); }
  #map { flex: 1; min-height: 0; }
  .sidebar { width: 320px; min-width: 320px; background: white; border-left: 1px solid #eceee6; overflow-y: auto; padding: 14px; -webkit-overflow-scrolling: touch; }
  .sidebar h3 { margin: 0 0 10px; font-size: 13px; color: #5c6656; text-transform: uppercase; letter-spacing: .5px; }

  .driver-card { border: 1px solid #eceee6; border-radius: 12px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
  .driver-card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .driver-dot { width: 12px; height: 12px; min-width: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  .driver-name { font-weight: 700; }
  .conn-badge { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .conn-badge.online { background: #e3f1d8; color: var(--green-dark); }
  .conn-badge.offline { background: #fdeaea; color: #b3423a; }
  .delivered-badge { display: inline-block; margin-top: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #f1f3ec; color: #45503c; }
  .stationary-note { margin-top: 4px; font-size: 12px; color: #a8710f; }
  .empty-state { text-align: center; padding: 40px 16px; color: #6b7566; }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }

  @media (max-width: 768px) {
    .layout { flex-direction: column; height: auto; }
    #map { flex: none; height: 48vh; min-height: 240px; width: 100%; }
    .sidebar { width: 100%; min-width: 0; border-left: none; border-top: 1px solid #eceee6; max-height: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img id="logoImg" class="logo-img" src="logo.png" alt="Uchben"
      onload="this.style.display='inline-block'; document.getElementById('brandFallback').style.display='none';"
      onerror="this.style.display='none';" />
    <span id="brandFallback"><span class="leaf">🌿</span> UCHBEN</span>
    &nbsp;· Monitoreo en vivo
  </div>
</div>

<div class="layout">
  <div id="map"></div>
  <div class="sidebar">
    <h3>Repartidores</h3>
    <div id="drivers">
      <div class="empty-state"><div class="icon">⏳</div><p>Cargando...</p></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
