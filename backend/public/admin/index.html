<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel de Repartidores</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; }
  .layout { display: flex; height: 100vh; }
  #map { flex: 1; }
  .sidebar { width: 340px; background: white; border-left: 1px solid #e2e8f0; overflow-y: auto; padding: 16px; }
  h3 { margin: 8px 0; }
  .stop { border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .stop label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .stop-color { width: 12px; height: 12px; min-width: 12px; border-radius: 50%; margin-top: 3px; }
  .stop-missing { border-color: #fca5a5; background: #fef2f2; }
  .stop-warn { color: #b91c1c; }
  .stop a { color: #2563eb; }
  .stop-assigned { border-color: #93c5fd; background: #eff6ff; }
  .stop-seq { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; min-width: 20px; border-radius: 50%; background: #2563eb; color: white; font-size: 11px; font-weight: 700; margin-top: 2px; }
  .stop-delivered { opacity: 0.55; }
  .pin-label { font-size: 12px; color: #64748b; margin-top: 4px; }
  select, button, input[type="text"] { width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }
  button { background: #2563eb; color: white; border: none; font-weight: 600; cursor: pointer; transition: background-color .15s ease, transform .05s ease; }
  button:hover { background: #1d4ed8; }
  button:active { transform: scale(0.97); }
  .btn-confirm { background: #16a34a; }
  .btn-confirm:hover { background: #15803d; }
  .preview-item { display: flex; align-items: center; gap: 8px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 8px; margin-top: 6px; font-size: 13px; }
  .preview-item span.name { flex: 1; }
  .mini-btn { width: auto; padding: 2px 8px; margin: 0; font-size: 14px; }
  .mini-btn:disabled { opacity: 0.3; cursor: default; }
  .btn-danger { background: #dc2626; }
  .btn-danger:hover { background: #b91c1c; }
  .stop-actions { display: flex; gap: 4px; margin-left: auto; align-self: flex-start; }
  .stop-actions .mini-btn { background: #e2e8f0; color: #334155; }
  .stop-actions .mini-btn:hover { background: #cbd5e1; }
  .stop-actions .mini-btn.remove { background: #fee2e2; color: #b91c1c; }
  .stop-actions .mini-btn.remove:hover { background: #fecaca; }
  .pass-gate { position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; }
  .driver-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; background: #dbeafe; color: #1e3a8a; margin-left: 6px; }
  .checkbox-label { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .checkbox-label input[type="checkbox"] { width: auto; margin: 0; }
  .stop-alerts-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #64748b; margin-top: 2px; cursor: pointer; }
  .stop-alerts-label input[type="checkbox"] { width: auto; margin: 0; }
  .tab-bar { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; }
  /* Selectores mas especificos que "button:hover" (con id, para no perder
     contra el hover generico de arriba y que las pestanas no "brinquen"
     a azul solido al pasar el mouse). */
  #stopTabs.tab-bar .tab-btn {
    width: auto; white-space: nowrap; padding: 6px 12px; font-size: 12px;
    background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0;
    border-radius: 999px; margin: 0; font-weight: 600;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .05s ease;
  }
  #stopTabs.tab-bar .tab-btn:hover { background: #e2e8f0; }
  #stopTabs.tab-bar .tab-btn:active { transform: scale(0.96); }
  #stopTabs.tab-bar .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
  #stopTabs.tab-bar .tab-btn.active:hover { background: #1d4ed8; }
</style>
</head>
<body>

<div class="pass-gate" id="gate">
  <div style="text-align:center">
    <h2>Panel de Administrador</h2>
    <input id="pass" type="password" placeholder="Contraseña" style="padding:12px;font-size:16px;border-radius:8px;border:1px solid #cbd5e1;" />
    <button onclick="enter()" style="margin-top:12px;">Entrar</button>
  </div>
</div>

<div class="layout" id="layout" style="display:none;">
  <div id="map"></div>
  <div class="sidebar">
    <h3>Repartidores</h3>
    <div id="drivers"></div>
    <input id="newDriverName" type="text" placeholder="Nombre del repartidor" />
    <input id="newDriverCode" type="text" placeholder="Código de acceso (ej. juan123)" />
    <button onclick="addDriver()">➕ Agregar repartidor</button>

    <h3>Kommo: embudo y etapa</h3>
    <select id="pipelineSelect" onchange="onPipelineChange()"></select>
    <select id="statusSelect" onchange="saveKommoFilter(true)"></select>
    <button onclick="saveKommoFilter()">💾 Guardar embudo/etapa</button>

    <h3>Kommo: campo (direccion o liga de Maps)</h3>
    <select id="fieldSelect" onchange="saveKommoFields(true)"></select>
    <button onclick="saveKommoFields()">💾 Guardar campo</button>

    <h3>Kommo: campo de factura (opcional)</h3>
    <select id="invoiceFieldSelect" onchange="saveInvoiceField(true)"></select>
    <button onclick="saveInvoiceField()">💾 Guardar factura</button>

    <button onclick="syncKommo()">🔄 Sincronizar pedidos desde Kommo</button>

    <h3>Pedidos</h3>
    <div id="stopTabs" class="tab-bar"></div>
    <div id="routeActions"></div>
    <div id="stops"></div>

    <div id="assignControls">
      <select id="driverSelect" onchange="clearPreview()"></select>

      <h3>Punto de partida</h3>
      <select id="startSelect" onchange="onStartSelectChange()">
        <option value="driver">Ubicación actual del repartidor</option>
        <option value="pin">📍 Elegir en el mapa</option>
      </select>
      <div id="startPinLabel" class="pin-label"></div>

      <h3>Punto final (opcional)</h3>
      <select id="endSelect" onchange="onEndSelectChange()">
        <option value="">(automático, sin punto fijo)</option>
        <option value="pin">🏁 Elegir en el mapa</option>
      </select>
      <div id="endPinLabel" class="pin-label"></div>

      <button onclick="previewRoute()">🔍 Vista previa de ruta</button>
      <div id="previewList"></div>
      <button id="confirmRouteBtn" class="btn-confirm" onclick="confirmRoute()" style="display:none;">✅ Confirmar y asignar</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
