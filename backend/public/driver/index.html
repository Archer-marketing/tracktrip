<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Repartidor</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1d4ed8" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #0f172a; color: #f1f5f9; min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .header { padding: 16px; background: #1e293b; text-align: center; font-weight: 700; font-size: 18px; }
  .driver-badge { font-size: 13px; font-weight: 400; margin-top: 4px; color: #cbd5e1; }
  .driver-badge a { color: #93c5fd; }
  .status { padding: 8px 16px; text-align: center; font-size: 13px; }
  .status.on { color: #4ade80; }
  .status.off { color: #f87171; }
  #login { padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  input { padding: 14px; font-size: 18px; border-radius: 10px; border: none; }
  button {
    padding: 16px; font-size: 17px; border-radius: 10px; border: none;
    background: #2563eb; color: white; font-weight: 600;
  }
  button:active { background: #1d4ed8; }
  #app { display: none; flex: 1; flex-direction: column; padding: 16px; gap: 16px; }
  .card { background: #1e293b; border-radius: 16px; padding: 20px; }
  .card h2 { margin: 0 0 8px; font-size: 20px; }
  .card p { margin: 4px 0; color: #cbd5e1; }
  .maps-btn { background: #16a34a; margin-top: 12px; }
  .done-btn { background: #64748b; margin-top: 8px; }
  .invoice-btn { display: block; text-align: center; text-decoration: none; color: white; background: #7c3aed; border-radius: 10px; padding: 12px; font-weight: 600; margin-top: 8px; }
  .invoice-text { font-size: 13px; }
  .remaining { font-size: 13px; color: #94a3b8; text-align: center; }
  .empty { text-align: center; color: #94a3b8; padding: 40px 0; }
  .toggle-route-btn { background: #334155; font-size: 14px; padding: 12px; }
  #routeMap { height: 220px; border-radius: 12px; margin-top: 12px; }
  .route-item { display: flex; align-items: center; gap: 10px; background: #1e293b; border-radius: 10px; padding: 10px; margin-top: 8px; }
  .route-item.done { opacity: 0.5; }
  .route-seq { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; min-width: 26px; border-radius: 50%; background: #2563eb; color: white; font-weight: 700; font-size: 13px; }
  .route-item.done .route-seq { background: #16a34a; }
  .route-info { flex: 1; font-size: 13px; }
  .route-link { color: #93c5fd; text-decoration: none; font-size: 20px; }
</style>
</head>
<body>
  <div class="header">
    🚚 Repartidor
    <div id="driverBadge" class="driver-badge" style="display:none;">
      <span id="driverNameLabel"></span> · <a href="#" onclick="logout(); return false;">Cambiar de repartidor</a>
    </div>
  </div>
  <div id="statusBar" class="status off">Ubicación: inactiva</div>

  <div id="login">
    <input id="code" placeholder="Tu código de acceso" autocomplete="off" />
    <button onclick="login()">Entrar</button>
  </div>

  <div id="app">
    <div id="stopCard"></div>
    <div class="remaining" id="remaining"></div>

    <button id="toggleRouteBtn" class="toggle-route-btn" onclick="toggleRoute()">🗺️ Ver ruta completa</button>
    <div id="routeSection" style="display:none;">
      <div id="routeMap"></div>
      <div id="routeList"></div>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
